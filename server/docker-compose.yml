# Self-hosted Open-Meteo API for AETHERIA 3D.
# Weather data is read on demand from the Open-Meteo open-data bucket on AWS S3 (CC BY 4.0,
# commercial use allowed) and kept in a local LRU cache. Caddy adds HTTPS, CORS and caching headers.

volumes:
  open-meteo-data:
  caddy-data:
  caddy-config:

services:
  open-meteo:
    image: ghcr.io/open-meteo/open-meteo
    container_name: open-meteo
    volumes:
      - open-meteo-data:/app/data
    environment:
      REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/
      CACHE_SIZE: ${CACHE_SIZE:-50GB}
    restart: always

  caddy:
    image: caddy:2
    container_name: caddy
    depends_on:
      - open-meteo
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always
